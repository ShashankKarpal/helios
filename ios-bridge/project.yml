name: HeliosBridge

options:
  bundleIdPrefix: com.shanky.helios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Generate the Info.plist and entitlements from the properties below.
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Program team. Set here rather than in Xcode's UI because
    # the .xcodeproj is generated and gitignored, so any team picked in the UI is
    # discarded on the next `xcodegen generate`. A Team ID is not a secret: it is
    # embedded in the entitlements of every signed build.
    DEVELOPMENT_TEAM: "GZAN9987X2"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HeliosBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanky.helios.bridge
        PRODUCT_NAME: Helios Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    entitlements:
      path: HeliosBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Required since iOS 15 so HKObserverQuery background wakeups and
        # enableBackgroundDelivery actually fire while the app is suspended.
        # Without this, HealthKit only delivers data while the app is in the
        # foreground, which is why sync stalled between foreground sessions.
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Helios Bridge
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # HealthKit read prompt copy.
        NSHealthShareUsageDescription: "Helios Bridge reads your Health data so it can sync it to your Mac on your local network. It never writes to Health."
        # background-fetch and background-processing. remote-notification was
        # removed 2026-07-24: no push server exists, the capability was unused.
        UIBackgroundModes:
          - fetch
          - processing
        # Must list every BGTask identifier the app submits.
        BGTaskSchedulerPermittedIdentifiers:
          - com.shanky.helios.bridge.refresh
        # helios-bridge://sync deep link.
        CFBundleURLTypes:
          - CFBundleURLName: com.shanky.helios.bridge
            CFBundleURLSchemes:
              - helios-bridge
        # ATS exception for the local HTTPS host. The Mac serves an mkcert
        # certificate whose root is trusted on the device, so normal TLS
        # validation succeeds and no insecure loads are needed. NSAllowsLocalNetworking
        # covers the .local mDNS host. If you point the app at a raw IP or an
        # untrusted certificate, you will need to relax this further (see README).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            helios.local:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: false
