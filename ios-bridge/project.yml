name: HeliosBridge

options:
  bundleIdPrefix: com.shanky.helios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Generate the Info.plist and entitlements from the properties below.
  minimumXcodeGenVersion: "2.35.0"

packages:
  # The sync engine, the durable outbox and their tests (swift test in BridgeCore),
  # and GlanceCore, the widget's and the morning notification's logic (rank 3).
  BridgeCore:
    path: BridgeCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Program team, from the HELIOS_DEVELOPMENT_TEAM environment
    # variable (xcodegen expands ${...}). Copy .env.example to .env in the repo
    # root, put your Team ID there and run ./generate.sh, which loads it and
    # refuses a missing or placeholder value (plain xcodegen would write an
    # empty team, or the literal ${...} text when the variable is unset). Set
    # here rather than in Xcode's UI because the .xcodeproj is generated and
    # gitignored, so a team picked in the UI is discarded on the next generate.
    DEVELOPMENT_TEAM: ${HELIOS_DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HeliosBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: BridgeCore
        product: BridgeCore
      - package: BridgeCore
        product: GlanceCore
      # The Helios widget (Home Screen and Lock Screen), embedded in the app.
      - target: HeliosGlance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanky.helios.bridge
        PRODUCT_NAME: Helios Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    entitlements:
      path: HeliosBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Required since iOS 15 so HKObserverQuery background wakeups and
        # enableBackgroundDelivery actually fire while the app is suspended.
        # Without this, HealthKit only delivers data while the app is in the
        # foreground, which is why sync stalled between foreground sessions.
        com.apple.developer.healthkit.background-delivery: true
        # Shared with the widget extension: the glance cache and the widget's
        # copy of the summary address and token (rank 3).
        com.apple.security.application-groups:
          - group.com.shanky.helios.bridge
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Helios Bridge
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # HealthKit read prompt copy.
        NSHealthShareUsageDescription: "Helios Bridge reads your Health data (samples, workouts and their routes, ECG recordings, activity rings) so it can send it to your own Mac. It never writes to Health."
        # background-fetch and background-processing. remote-notification was
        # removed 2026-07-24: no push server exists, the capability was unused.
        UIBackgroundModes:
          - fetch
          - processing
        # Must list every BGTask identifier the app submits.
        BGTaskSchedulerPermittedIdentifiers:
          - com.shanky.helios.bridge.refresh
          - com.shanky.helios.bridge.processing
        # helios-bridge://sync deep link.
        CFBundleURLTypes:
          - CFBundleURLName: com.shanky.helios.bridge
            CFBundleURLSchemes:
              - helios-bridge
        # ATS exception for the local HTTPS host. The Mac serves an mkcert
        # certificate whose root is trusted on the device, so normal TLS
        # validation succeeds and no insecure loads are needed. NSAllowsLocalNetworking
        # covers the .local mDNS host. A host the certificate does not name, or a
        # certificate the device does not trust, fails TLS regardless of ATS: fix
        # the certificate (README section 3), never relax this block.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            shanky-m4.local:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: false

  # Rank 3: one widget, Home Screen (small) and Lock Screen (rectangular). It
  # reads the glance cache in the App Group and may ask heliosd itself. No brand
  # asset: the widget gallery shows the app's icon.
  HeliosGlance:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GlanceWidget
    dependencies:
      - package: BridgeCore
        product: GlanceCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanky.helios.bridge.glance
        PRODUCT_NAME: HeliosGlance
        SKIP_INSTALL: YES
    entitlements:
      path: GlanceWidget/HeliosGlance.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shanky.helios.bridge
    info:
      path: GlanceWidget/Info.plist
      properties:
        CFBundleDisplayName: Helios
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The same ATS block as the app, so the widget and the app treat a
        # typed Summary from address the same way.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            shanky-m4.local:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: false
              NSExceptionRequiresForwardSecrecy: false
