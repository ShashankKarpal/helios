[project]
name = "heliosd"
version = "1.0.0"
description = "Helios daemon: local-only personal health system. Designed and built by Claude."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "duckdb>=0.10",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
insights = ["scipy>=1.12", "numpy>=1.26"]
labs = ["pdfplumber>=0.11"]
mcp = ["mcp>=1.0"]
mac = ["ocrmac>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heliosd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
