# Synthetic metric-policy overlay for the test suite (merged over
# config/metric_policy.yaml through HELIOS_HOME, see tests/conftest.py).
# Only the keys that differ from the repository default appear here: the
# priority and corroboration lists that name the synthetic devices in
# fixtures/source_registry.yaml. Dicts merge key by key; a list replaces the
# default list. The lists mirror the owner's device priority (owner decision
# 4h, fix program D11 and B10, 2026-10-08) with synthetic keys: test_meter for
# the fingerstick meter, test_cgm for the historical CGM.

metrics:
  heart_rate:
    priority: [zepp_helio, apple_watch_ultra, whoop, apple_watch_6_legacy]
  resting_hr:
    priority: [whoop, apple_watch_ultra, zepp_helio, apple_watch_6_legacy]
  hrv_sdnn:
    priority: [apple_watch_ultra, apple_watch_6_legacy]
  respiratory_rate:
    priority: [whoop, apple_watch_ultra, apple_watch_6_legacy, zepp_helio]
  spo2:
    priority: [apple_watch_ultra, apple_watch_6_legacy]
    corroboration: [whoop, zepp_helio]
  wrist_temp:
    priority: [apple_watch_ultra]
  body_temp:
    priority: [test_cgm]
  vo2max:
    priority: [apple_watch_ultra]
  steps:
    priority: [apple_watch_ultra, apple_watch_6_legacy, iphone, zepp_helio]
  active_energy:
    priority: [apple_watch_ultra, apple_watch_6_legacy]
  basal_energy:
    priority: [apple_watch_ultra, apple_watch_6_legacy]
  sleep_analysis:
    priority: [whoop, apple_watch_ultra, apple_watch_6_legacy, zepp_helio]
  sleep_duration:
    priority: [whoop, "whoop:healthkit", apple_watch_ultra, apple_watch_6_legacy, zepp_helio]
  glucose:
    priority: [test_meter]
  glucose_cgm:
    priority: [test_cgm]
    derive: {from: glucose, devices: [test_cgm]}
