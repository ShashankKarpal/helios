# Copy to ~/Helios/helios.toml and edit. Never commit the real file.

[server]
host = "0.0.0.0"
port = 8420
tls_cert = "~/Helios/certs/shanky-m4.local.pem"     # mkcert output; both empty = plain HTTP (dev only); a set path that does not load stops the start (exit 2), never a silent fall back to HTTP
tls_key = "~/Helios/certs/shanky-m4.local-key.pem"
ingest_token = "change-me-long-random"            # the one shared secret: Bridge (/ingest), PWA, Shortcut and MCP (/api/*) all send it as X-Helios-Token. The daemon refuses to start while this is the placeholder.
# api_auth = "off"                                # rollback only: serve /api/* without the token (logged loudly). Never the steady state.
allow_clients = "tailnet"                         # who is served: "tailnet" (the default when unset) answers loopback, this Mac's own addresses and your Tailscale tailnet (100.64.0.0/10, fd7a:115c:a1e0::/48, counted only when the connection arrives on this Mac's own Tailscale address) and gives every other client 403, the home Wi-Fi included, because the served PWA shell carries the token. "any" is the rollback: every client that can reach the port.
first_tick_seconds = 120                          # the first background tick (recompute, Whoop pull, feeds, watchdog) runs this long after startup, then every background_interval_seconds (default 3600)

[storage]
data_dir = "~/Helios/data"
db_path = "~/Helios/data/helios.duckdb"
legacy_db_path = ""                               # optional: existing vpetersson DuckDB for backfill parity

[owner]
name = "Your Name"
timezone = "UTC"                                  # IANA name, e.g. Europe/London
heat_months = [6, 7, 8]                           # months when local heat may affect recovery

[llm]
base_url = "http://localhost:1234/v1"
primary_model = "qwen3.6-35b-a3b"                 # Qwen3.6-35B-A3B MLX 4-bit: lms get qwen/qwen3.6-35b-a3b --mlx
fallback_model = "qwen3.6-35b-a3b"                # same model on purpose; the final retry runs at temperature 0
narrative_temperature = 0.2
chat_temperature = 0.65
timeout_seconds = 120

[whoop]
enabled = false                                   # set true after registering a free Whoop developer app
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:8420/whoop/callback"
token_path = "~/Helios/data/whoop_tokens.json"
wake_window = "05:00-10:00"                       # hours of your reporting day in which the daemon pulls Whoop every wake_poll_minutes until last night's sleep and its recovery are scored (3 requests a pull), then waits for the next day; the hourly pull stays
wake_poll_minutes = 15                            # 0 turns the wake-window polling off

[notifications]
macos_alerts = true                               # watchdog alerts via osascript

[backup]
remote = ""                                       # optional: user@host for the nightly export copy (see SETUP.md); empty = local export only
remote_dir = "Backups/helios"
keep_days = 30
include_overlays = true

[relay]
remote = ""                                       # optional: user@host of the spool receiver on an always-on Mac (see SETUP.md)
remote_spool = "HeliosSpool"
keep_delivered_days = 3
