# Helios source registry.
# Apple Health source names contain a curly apostrophe (U+2019), so device keys
# are resolved with wildcard patterns, never straight-quote equality.
# Order matters: first match wins.
#
# THIS FILE IS THE PUBLIC DEFAULT. Put your own lineup, including anything you
# would rather not publish (medical devices, exact model names), in
# $HELIOS_HOME/source_registry.yaml (default ~/Helios). That file is merged
# over this one at startup; because order decides matches, its `devices` list
# REPLACES this list wholesale, so copy the entries you keep. `ignored` and
# `fallback_key` follow the same rule. Unmatched sources fall through to
# fallback_key and still ingest fine.
#
# The keys below are the ones config/metric_policy.yaml refers to by default.
# cgm and glucose_meter are placeholders with no patterns: fill them in, or
# leave them and the glucose metric simply has no source until you do.

devices:
  - key: whoop
    label: Whoop
    patterns: ["WHOOP*"]
  - key: zepp_life_scale
    label: Smart scale (Zepp Life)
    patterns: ["Zepp Life*"]
  - key: zepp_strap
    label: Amazfit strap (Zepp)
    patterns: ["Zepp*"]
  - key: apple_watch
    label: Apple Watch
    patterns: ["*Apple Watch*", "*Apple Watch"]
  - key: iphone
    label: iPhone
    patterns: ["*iPhone*", "iPhone"]
  - key: cgm
    label: Continuous glucose monitor
    patterns: []                  # e.g. ["MyCGMApp*"]; history-only lineups add `active: false`
  - key: glucose_meter
    label: Glucose meter
    patterns: []                  # e.g. ["MyMeterApp*"]
  - key: myfitnesspal
    label: MyFitnessPal
    patterns: ["MyFitnessPal*"]
  - key: bridge
    label: Helios Bridge
    patterns: ["Helios Bridge*"]

ignored:
  - "Athlytic*"
  - "SleepWatch*"
  - "Bevel*"
  - "Carb Manager*"
  - "Blood Oxygen*"
  - "Health"

fallback_key: other
