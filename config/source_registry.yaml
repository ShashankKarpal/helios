# Helios source registry.
# Apple Health source names contain a curly apostrophe (U+2019), so device keys
# are resolved with wildcard patterns, never straight-quote equality.
# Order matters: first match wins.
#
# Edit this to match your own device lineup. Keep entries you would rather not
# publish (for example medical devices) in a local commit or a private fork;
# unmatched sources fall through to fallback_key and still ingest fine.

devices:
  - key: whoop
    label: Whoop
    patterns: ["WHOOP*"]
  - key: zepp_life_scale
    label: Smart scale (Zepp Life)
    patterns: ["Zepp Life*"]
  - key: zepp_strap
    label: Amazfit strap (Zepp)
    patterns: ["Zepp*"]
  - key: apple_watch
    label: Apple Watch
    patterns: ["*Apple Watch*", "*Apple Watch"]
  - key: iphone
    label: iPhone
    patterns: ["*iPhone*", "iPhone"]
  - key: myfitnesspal
    label: MyFitnessPal
    patterns: ["MyFitnessPal*"]
  - key: bridge
    label: Helios Bridge
    patterns: ["Helios Bridge*"]

ignored:
  - "Athlytic*"
  - "SleepWatch*"
  - "Bevel*"
  - "Carb Manager*"
  - "Blood Oxygen*"
  - "Health"

fallback_key: other
