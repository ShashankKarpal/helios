# Helios metric policy: the device source of truth. Authoritative, owner-defined.
#
# Grounded in the owner's per-metric device audit (compass wearable source-of-truth
# audit, 2026-07): placement beats brand for exercise HR (upper-arm PPG rho_c 0.992
# vs <=0.85 wrist); Whoop overnight rMSSD is the correct autonomic anchor (Altini);
# Whoop respiratory rate is validated within 1 breath/min (JCSM); Apple Watch leads
# for resting HR, SpO2, VO2 Max, energy, and overnight wrist temperature; the scale
# owns body composition. Reference lineup: a Whoop band and an upper-arm strap
# (bicep), an Apple Watch (wrist), a smart scale. No chest strap; bicep devices
# lead exercise HR.
#
# THIS FILE IS THE PUBLIC DEFAULT. Device keys here (apple_watch, zepp_strap,
# zepp_life_scale, whoop, iphone, cgm, glucose_meter, myfitnesspal) are the
# generic keys of config/source_registry.yaml. Your own lineup, thresholds and
# temporary snoozes live in $HELIOS_HOME/metric_policy.yaml (default
# ~/Helios), which is merged over this file at startup: dicts key by key,
# lists replaced. Example overlay:
#
#   metrics:
#     heart_rate: {priority: [my_strap, my_watch, whoop]}
#     body_mass:  {snooze_until: 2026-12-31}   # scale packed away
#
# priority: device keys in descending trust order for the canonical daily value.
#   The top-priority device PRESENT wins; others are labeled corroboration.
#   A key `<device>:healthkit` is that device's HealthKit copy, arbitrating as
#   a key of its own (a labelled fallback); it needs a sync_paths entry.
# corroboration: devices shown beside the value and scored for agreement,
#   never chosen as the value (plan v2 4.2). Absent: the other priority
#   devices present corroborate; []: nothing does; a list: the other priority
#   devices present plus the listed ones. A key never corroborates another key
#   of its own device (Whoop's HealthKit copy never corroborates Whoop).
# direction: which way is favorable when compared to the personal baseline.
#   lower | higher | band (stay near baseline) | none (informational)
# never_blend: values from different devices are never averaged. Always true;
#   listed explicitly where confusion is likely.
# live_overlay: whoop metrics served live for today and trailing 7 days.
# cadence_hours: expected reporting interval used by the sync watchdog.
# trust: absolute | trend_only | screening | directional. Encoded per the audit:
#   trend_only and screening metrics are honest about weak absolute validation
#   (VO2 Max MAPE ~13%, calories 10-115%, BIA body fat +/-3-10 points, SpO2
#   ~85% hypoxia detection). Narrative and chat must not treat them as precise.

metrics:
  heart_rate:
    hk: HKQuantityTypeIdentifierHeartRate
    unit: count/min
    # REORDER 2026-07-25, grounded in the device write audit: placement still
    # rules (bicep beats wrist), but this metric arbitrates the HEALTHKIT stream,
    # and Whoop writes HR to Health only sporadically (workout-centric) and its
    # writer stalled entirely on 2026-07-22 despite permission being on. Amazfit
    # Helio is the same upper-arm placement with dense continuous samples, so it
    # leads; Watch is the live-when-worn second; Whoop stays as corroboration.
    # Whoop's autonomic authority (rMSSD, RHR) is unaffected: it arrives via the
    # cloud puller, not this stream. Add a Polar H10 as primary if ever purchased.
    priority: [zepp_strap, apple_watch, whoop]
    direction: none
    trust: absolute
    # RAISED 6 -> 12 (2026-07-31): HR is HealthKit protected data, readable only
    # while the iPhone is unlocked, so background delivery routinely lags 6-12h
    # and backfills losslessly on unlock. Alerting on delivery lag under 24h was
    # pure noise; Whoop cloud keeps the HR-family headline numbers live anyway.
    cadence_hours: 12
  resting_hr:
    hk: HKQuantityTypeIdentifierRestingHeartRate
    unit: count/min
    # SWAP 2026-10-08 (owner decision 4h, fix program D11): Whoop's overnight
    # value from its cloud API is the official resting HR; Apple's all-day
    # value (MAE ~3.7 bpm) and the strap are labelled fallbacks, never judged
    # against the Whoop baseline.
    priority: [whoop, apple_watch, zepp_strap]
    live_overlay: whoop
    direction: lower
    trust: absolute
    flag_rule: "abs_above_30d_avg >= 5"
    # Apple's daily summary runs from about 22:30 to 22:29 and is rewritten
    # under the same start through the day: it files on the day that holds
    # its midpoint, and only its latest-ending version counts (Wave 2, B3).
    day_basis: interval_midpoint
    # Whoop's resting HR is its cloud value, the overnight resting HR of the
    # recovery record (owner decision D11, Wave 2 B5), final once present.
    # Its HealthKit copy (the Bridge path) is stored and never arbitrated.
    sync_paths: {whoop: [whoop_live]}
    cadence_hours: 26
  hrv_sdnn:
    hk: HKQuantityTypeIdentifierHeartRateVariabilitySDNN
    unit: ms
    # Spot check only: SDNN mixes sympathetic and parasympathetic signal and
    # Apple's serial sampling failed the +/-10 ms equivalence margin. Watches
    # only (fix program B10): the strap's HRV definition is unverified, so it
    # never fills a day.
    priority: [apple_watch]
    direction: higher
    never_blend: true
    trust: directional
    note: "SDNN spot check only. Trend anchor is hrv_rmssd (Whoop). Separate series, never blended or compared."
    cadence_hours: 26
  hrv_rmssd:
    hk: null            # not a HealthKit type; arrives via the Whoop puller
    unit: ms
    # KEEP: overnight rMSSD is the correct recovery anchor (Whoop 4.0 CCC 0.94
    # vs ECG). Best for trend; a morning orthostatic reading would beat it for
    # acute readiness if a chest strap is ever added.
    priority: [whoop]
    direction: higher
    never_blend: true
    trust: absolute
    flag_rule: "below_30d_baseline_pct >= 15"
    # Measured over the night and complete once present: never a running total
    # of the reporting today (fix program A4, owner decision D7).
    sample_context: sleep_only
    cadence_hours: 26
  respiratory_rate:
    hk: HKQuantityTypeIdentifierRespiratoryRate
    unit: count/min
    # SWAP (stored priority): Whoop is validated within 1 breath/min (JCSM,
    # UArizona) and its samples land via the puller; Apple and Zepp are history
    # and corroboration.
    priority: [whoop, apple_watch, zepp_strap]
    live_overlay: whoop
    direction: band
    trust: absolute
    # Measured over the night and complete once present: never a running total
    # of the reporting today (fix program A4, owner decision D7).
    sample_context: sleep_only
    # One value per night on its wake date (Wave 2, B6): Whoop's API interval
    # files on its end date, a watch's readings on the wake date of the
    # watch's own main sleep episode (readings outside every episode drop).
    day_basis: sleep_end
    # Whoop's value is its cloud API record. Its HealthKit copy (the Bridge
    # path) is stored and never arbitrated, so the two never blend; listing
    # whoop:healthkit in priority would make it a labelled fallback instead.
    sync_paths: {whoop: [whoop_live]}
    cadence_hours: 26
  spo2:
    hk: HKQuantityTypeIdentifierOxygenSaturation
    unit: "%"
    # KEEP Apple primary (closest to clinical reference among consumer watches,
    # MAE 2.2%). Screening trend only: consumer SpO2 is not diagnostic.
    # Whoop added 2026-07-25: the write audit shows it does deliver SpO2 to
    # Health daily (1.9k samples, current), so it corroborates. Arm SpO2 is
    # unvalidated (fix program B10): Whoop and the strap are shown beside the
    # watch's value and never fill a day.
    priority: [apple_watch]
    corroboration: [whoop, zepp_strap]
    direction: higher
    trust: screening
    cadence_hours: 26
  wrist_temp:
    hk: HKQuantityTypeIdentifierAppleSleepingWristTemperature
    unit: degC
    # Explicit temperature primary per audit: Apple's two-sensor overnight
    # design is the most robust baseline-deviation tracker. Deviation from
    # baseline is the signal; absolute skin temp is not core temperature.
    priority: [apple_watch]
    direction: band
    trust: absolute
    # Measured over the night and complete once present: never a running total
    # of the reporting today (fix program A4, owner decision D7).
    sample_context: sleep_only
    # The night's interval files on its end date, the wake date (Wave 2, B3).
    day_basis: sleep_end
    cadence_hours: 26
  body_temp:
    hk: HKQuantityTypeIdentifierBodyTemperature
    unit: degC
    # The only writer of this type in the owner's history is the Ultrahuman
    # ring, which writes its SKIN temperature under HealthKit's body
    # temperature identifier (daily means 21 to 37 degC: not core
    # temperature). The key stays body_temp; every surface labels it as skin
    # temperature (fix program A20, audit M17, 2026-10-08).
    label: Skin temperature (ring)
    # CORRECTED 2026-07-25 per the device write audit: NO current device writes
    # BodyTemperature to Health. Zepp's write list has Water Temperature only
    # (removed from priority: it was a dead expectation); Whoop does not write
    # temperature at all (its skin temp lives in the cloud recovery payload, a
    # future puller addition). A CGM app is the typical historical series.
    # Optional so the watchdog never expects fresh data. The live
    # temperature signal is wrist_temp (Watch, overnight).
    priority: [cgm]
    direction: band
    trust: directional
    cadence_hours: 26
    optional: true
  vo2max:
    hk: HKQuantityTypeIdentifierVO2Max
    unit: mL/min/kg
    # KEEP Apple, but trend-only: underestimates by ~6 mL/kg/min vs metabolic
    # cart, MAPE ~13%. Track your own slope over months, not the number.
    priority: [apple_watch]
    direction: higher
    trust: trend_only
    cadence_hours: 720
    # The Watch writes a VO2 Max estimate only after a qualifying outdoor walk,
    # run, or hike workout, so the sample depends on the owner doing one, like
    # food logging. Silence is expected, not a fault; the sync watchdog does
    # not raise an alert for it (2026-09-05).
    optional: true
  steps:
    hk: HKQuantityTypeIdentifierStepCount
    unit: count
    # SWAP per audit: watch MAPE ~6.4% vs phone undercounting ~12% when set
    # down. Watch is worn all day; iPhone is the gap-filler.
    priority: [apple_watch, iphone]
    direction: higher
    trust: absolute
    cadence_hours: 26
  active_energy:
    hk: HKQuantityTypeIdentifierActiveEnergyBurned
    unit: kcal
    # KEEP Apple (most-validated integrator), but calories are rough estimates
    # industry-wide (no device under 20% error in Stanford study). No arm
    # device or Whoop fallback (fix program B10).
    priority: [apple_watch]
    direction: none
    trust: trend_only
    cadence_hours: 26
  basal_energy:
    hk: HKQuantityTypeIdentifierBasalEnergyBurned
    unit: kcal
    priority: [apple_watch]
    direction: none
    trust: trend_only
    cadence_hours: 26
  sleep_analysis:
    hk: HKCategoryTypeIdentifierSleepAnalysis
    unit: min
    # KEEP Whoop as sleep owner (best TST and deep-sleep agreement vs PSG).
    # Apple is the REM cross-check (better REM detection in EEG comparisons but
    # under-reports deep). Single-night stage splits are directional, not precise.
    priority: [whoop, apple_watch, zepp_strap]
    direction: none
    trust: directional
    note: "Whoop owns sleep. Apple retained as REM cross-check and history; Zepp staging rated poor. Whoop's HealthKit copy never outranks its API night: sleep_duration lists it as whoop:healthkit, a labelled fallback for nights with no API record."
    cadence_hours: 26
  sleep_duration:
    hk: null            # derived nightly; whoop direct value + stage fallbacks
    unit: h
    # Whoop's API night owns; Whoop's own HealthKit copy of the night is its
    # labelled fallback (owner decision D6), then the watch, then the strap.
    priority: [whoop, "whoop:healthkit", apple_watch, zepp_strap]
    sync_paths: {whoop: [whoop_live]}
    direction: higher
    # Trend only (owner decision 4h): consumer sleep totals are good for your
    # own night-to-night trend, not as an absolute number.
    trust: trend_only
    flag_rule: "below_hours 7"
    cadence_hours: 26
  glucose:
    hk: HKQuantityTypeIdentifierBloodGlucose
    unit: mg/dL
    # A fingerstick meter app for current readings. A CGM's dense history is
    # never a fallback for a glucose day (owner decision 4h); it is a series of
    # its own. Both keys are placeholders in the public registry; name your own
    # apps in the HELIOS_HOME overlay.
    priority: [glucose_meter]
    direction: band
    trust: absolute
    cadence_hours: 2160
  body_mass:
    hk: HKQuantityTypeIdentifierBodyMass
    unit: kg
    # Scale weight is near-truth (~0.3 kg vs DEXA reference).
    priority: [zepp_life_scale]
    direction: none
    trust: absolute
    cadence_hours: 168
  body_fat_pct:
    hk: HKQuantityTypeIdentifierBodyFatPercentage
    unit: "%"
    # BIA body fat is +/-3-10 points vs DEXA: same-conditions trend only.
    priority: [zepp_life_scale]
    direction: none
    trust: trend_only
    cadence_hours: 168
  lean_mass:
    hk: HKQuantityTypeIdentifierLeanBodyMass
    unit: kg
    priority: [zepp_life_scale]
    direction: none
    trust: trend_only
    cadence_hours: 168
  bmi:
    hk: HKQuantityTypeIdentifierBodyMassIndex
    unit: count
    priority: [zepp_life_scale]
    direction: none
    trust: absolute
    cadence_hours: 168
  dietary_energy:
    hk: HKQuantityTypeIdentifierDietaryEnergyConsumed
    unit: kcal
    priority: [myfitnesspal]
    direction: none
    trust: absolute
    cadence_hours: 48
    # Depends on the owner logging food. Silence is expected, not a fault, so
    # the sync watchdog does not raise an alert when it goes quiet.
    optional: true
  # Whoop-only metrics (no HealthKit type; ingested by the Whoop puller)
  recovery_score:
    hk: null
    unit: "%"
    # Purpose-built composite over Whoop's validated strengths (rMSSD, RHR,
    # respiratory rate, sleep). Use directionally per Altini's composite caveat.
    priority: [whoop]
    direction: higher
    trust: directional
    zones: {green: [67, 100], yellow: [34, 66], red: [0, 33]}
    cadence_hours: 26
  strain:
    hk: null
    unit: score
    # Time-in-HR-zone construct; tolerates minor HR error. Directional load gauge.
    priority: [whoop]
    direction: none
    trust: directional
    # A Whoop cycle runs from one sleep onset to the next: its strain files on
    # the day of the cycle's recovery (12 h after the start without one), and
    # the open cycle is "strain so far", ungraded, until it closes (Wave 2, B7).
    day_basis: whoop_cycle
    cadence_hours: 26
  sleep_need:
    hk: null
    unit: h
    priority: [whoop]
    direction: none
    trust: directional
    # The night's need sits on its wake date, beside the night's sleep (Wave 2, B8).
    day_basis: sleep_end
    cadence_hours: 26

baseline:
  windows_days: [30, 60, 90]
  default_window: 30
  min_days: 7
  mad_flag_multiplier: 1.5

confidence:
  weights: {source_rank: 0.35, freshness: 0.25, coverage: 0.2, agreement: 0.2}
  grades: {A: 0.85, B: 0.7, C: 0.5, D: 0.0}
  agreement_tolerance_pct: 12
